name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p ferrovgl-core -p ferrovgl-draw-sw -p ferrovgl-fonts -p ferrovgl-widgets --no-default-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      # The umbrella crate's `sdl` feature links SDL2, which only the Linux runner installs.
      - if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --exclude ferrovgl-sdl --exclude ferrovgl-wasm
      - if: runner.os != 'Linux'
        run: cargo test --workspace --all-features --exclude ferrovgl-sdl --exclude ferrovgl-wasm --exclude ferrovgl
      - if: runner.os == 'Linux'
        run: cargo test -p ferrovgl-sdl
      - if: runner.os == 'Linux'
        name: Run every ported example headless through the SDL runner
        run: |
          cargo build -p ferrovgl-sdl --example lv_examples --locked
          for n in $(./target/debug/examples/lv_examples --list); do
            SDL_VIDEODRIVER=dummy ./target/debug/examples/lv_examples "$n" --frames 3 || exit 1
          done
      - run: cargo test -p ferrovgl-examples --no-default-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ferrovgl-core -p ferrovgl-draw-sw -p ferrovgl-fonts -p ferrovgl-widgets -p ferrovgl --all-features

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p ferrovgl-core -p ferrovgl-draw-sw -p ferrovgl-widgets --each-feature --no-dev-deps

  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "thumbv7em-none-eabihf,thumbv6m-none-eabi" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask nostd-check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrovgl-wasm --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p ferrovgl-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: jetli/wasm-pack-action@v0.4.0
        with: { version: v0.15.0 }
      - run: wasm-pack build crates/ferrovgl-wasm --target web --release --out-dir www/pkg -- --locked
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node crates/ferrovgl-wasm/scripts/node-smoke.mjs
      - run: ls -l crates/ferrovgl-wasm/www/pkg/ferrovgl_wasm_bg.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-demo
          path: crates/ferrovgl-wasm/www

  size-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi
          components: llvm-tools
      - run: cargo xtask size-report >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: cargo xtask size-report || true

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      # rust-toolchain.toml pins stable; docsrs needs nightly for doc_cfg.
      - run: cargo +nightly doc --workspace --no-deps --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask refimgs sync
      - name: API mapping page is up to date
        run: cargo xtask gen-mapping --check
      - run: cargo test -p ferrovgl-test --all-features --locked -- --include-ignored
      - if: always()
        run: cargo xtask parity-report >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diffs
          path: target/parity
          if-no-files-found: ignore
