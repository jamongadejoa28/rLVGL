[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "ISC",
    "MPL-2.0",
]
confidence-threshold = 0.9

# The DejaVu Sans glyph data in ferrovgl-fonts (data/*.lvfnt) is under the
# Bitstream Vera Fonts licence (crates/ferrovgl-fonts/LICENSE-DejaVu.txt).
[[licenses.exceptions]]
crate = "ferrovgl-fonts"
allow = ["Bitstream-Vera"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
