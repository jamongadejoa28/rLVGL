[package]
name = "ferrovgl-fonts"
description = "Built-in bitmap fonts (Montserrat, UNSCII, ...) for ferrovgl, converted from LVGL v9.6.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "data/**", "OFL.txt", "Cargo.toml"]

[features]
default = ["montserrat-14", "default-montserrat-14"]
montserrat-8 = []
montserrat-10 = []
montserrat-12 = []
montserrat-14 = []
montserrat-16 = []
montserrat-18 = []
montserrat-20 = []
montserrat-22 = []
montserrat-24 = []
montserrat-26 = []
montserrat-28 = []
montserrat-30 = []
montserrat-32 = []
montserrat-34 = []
montserrat-36 = []
montserrat-38 = []
montserrat-40 = []
montserrat-42 = []
montserrat-44 = []
montserrat-46 = []
montserrat-48 = []
montserrat-28-compressed = []
default-montserrat-14 = ["montserrat-14"]
unscii-8 = []
unscii-16 = []
# `lv_font_dejavu_16_persian_hebrew` (LV_FONT_DEJAVU_16_PERSIAN_HEBREW).
dejavu-16-persian-hebrew = []
ttf = []

[dependencies]
ferrovgl-core = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
