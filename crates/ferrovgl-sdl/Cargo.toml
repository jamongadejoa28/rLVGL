[package]
name = "ferrovgl-sdl"
description = "SDL2 display backend for the ferrovgl desktop simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrovgl-sdl"
readme = "README.md"
keywords = ["gui", "sdl2", "simulator", "desktop", "lvgl"]
categories = ["gui", "simulation"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
    "/TRADEMARK.md",
    "/src/**",
    "/examples/**",
]

[dependencies]
ferrovgl-core = { workspace = true, features = ["std"] }
ferrovgl-draw-sw = { workspace = true, features = ["std", "complex", "complex-gradients", "cf-xrgb8888", "cf-argb8888", "cf-argb8888-premultiplied", "cf-a8"] }
ferrovgl-widgets = { workspace = true, features = ["std", "label", "button", "image", "theme-default"] }
sdl2 = { workspace = true }

[dev-dependencies]
ferrovgl-core = { workspace = true, features = ["flex", "grid"] }
ferrovgl-fonts = { workspace = true, features = ["montserrat-14"] }
ferrovgl-examples = { workspace = true, features = ["std", "complex-gradients"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
