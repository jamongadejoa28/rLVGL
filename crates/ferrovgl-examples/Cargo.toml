[package]
name = "ferrovgl-examples"
description = "Ports of the LVGL v9.6.0 lv_example_* functions, shared by the SDL and browser demos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrovgl-examples"
readme = "README.md"
keywords = ["gui", "examples", "widgets", "embedded", "lvgl"]
categories = ["gui", "embedded", "no-std"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
    "/TRADEMARK.md",
    "/src/**",
]

[features]
default = ["complex-gradients"]
std = ["ferrovgl-core/std", "ferrovgl-widgets/std"]
# Build the `LV_USE_DRAW_SW_COMPLEX_GRADIENTS` branch of the gradient examples
# (`lv_example_style_gradient_{buttons,conic,radial}`); without it they show
# the upstream "is not enabled" label. Enable it together with the
# `complex-gradients` feature of the `ferrovgl-draw-sw` that renders them.
complex-gradients = []

[dependencies]
ferrovgl-core = { workspace = true, features = ["float", "flex", "grid", "observer", "snapshot"] }
ferrovgl-widgets = { workspace = true, features = ["label", "button", "image", "bar", "slider", "switch", "checkbox", "arc", "line", "led", "spinner", "buttonmatrix", "textarea", "observer", "theme-default", "theme-simple"] }
ferrovgl-fonts = { workspace = true, features = ["montserrat-14", "default-montserrat-14"] }

[dev-dependencies]
# Path-only (no version): `cargo publish` strips it, since ferrovgl-test is not published.
ferrovgl-test = { path = "../ferrovgl-test" }

# The table covers the reference configuration (complex gradients on).
# `tests/` is left out of the package (it needs the unpublished ferrovgl-test),
# so `cargo package` notes that it ignores this target.
[[test]]
name = "snapshots"
required-features = ["complex-gradients"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
