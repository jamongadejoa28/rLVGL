# Upstream LVGL v9.6.0 reference-image parity scope for ferrovgl v0.1.
#
# One [[image]] per PNG under tests/upstream/lvgl/tests/ref_imgs (sorted by path).
# path       : relative to tests/ref_imgs (the screenshot_compare name)
# test_file  : upstream file that produces it; test_fn is the first test function
#              (in file order) that compares it, also_test_fns lists the others
# in_scope   : rendered only with what ferrovgl has or v0.1 promises
# matched    : target/parity/<path>.result said "matched" in the fresh parity run
#              (rm -rf target/parity; cargo test -p ferrovgl-test --all-features
#              -- --include-ignored) this file was last updated from;
#              `cargo xtask parity-report` prints live in-scope coverage and flags
#              entries whose flag no longer agrees with target/parity
# Parity config: tests/configs/full.defconfig + depth_32 + run_tests on an amd64
# host (LV_BIN_DECODER_RAM_LOAD=n, CHECK_ARG_ASSERT_ON_FAIL=y, NON_AMD64_BUILD
# undefined, so *.lp64.png is the compared variant and *.lp32.png never is).

