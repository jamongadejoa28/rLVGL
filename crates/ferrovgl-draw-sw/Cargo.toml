[package]
name = "ferrovgl-draw-sw"
description = "Software renderer for ferrovgl (port of LVGL v9.6.0 src/draw/sw), no_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `complex-gradients` (LV_USE_DRAW_SW_COMPLEX_GRADIENTS) and
# `cf-argb8888-premultiplied` stay on by default because the upstream
# reference images are rendered with tests/configs/full.defconfig
# (CONFIG_LV_USE_DRAW_SW_COMPLEX_GRADIENTS=y); the lv_conf_template.h
# default is 0, so embedded builds disable it with --no-default-features.
default = ["complex", "complex-gradients", "cf-rgb565", "cf-rgb565-swapped", "cf-rgb888", "cf-xrgb8888", "cf-argb8888", "cf-argb8888-premultiplied", "cf-l8", "cf-al88", "cf-a8", "cf-i1"]
std = ["ferrovgl-core/std"]
complex = []
complex-gradients = []
cf-rgb565 = []
cf-rgb565-swapped = []
cf-rgb888 = []
cf-xrgb8888 = []
cf-argb8888 = []
cf-argb8888-premultiplied = []
cf-l8 = []
cf-al88 = []
cf-a8 = []
cf-i1 = []

[dependencies]
ferrovgl-core = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
