[package]
name = "ferrovgl-embedded"
description = "Placeholder for the planned embedded-graphics / embedded-hal adapters of ferrovgl (no API in 0.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrovgl-embedded"
readme = "README.md"
keywords = ["embedded-graphics", "embedded", "gui", "placeholder", "lvgl"]
categories = ["embedded", "no-std", "gui"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
    "/TRADEMARK.md",
    "/src/**",
]

[features]
default = []

[dependencies]
ferrovgl-core = { workspace = true }
embedded-graphics = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
