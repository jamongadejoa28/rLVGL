[package]
name = "ferrovgl-core"
description = "Core of ferrovgl, a pure-Rust reimplementation of LVGL v9.6.0: object tree, styles, events, layouts, draw model, fonts, input, timers, animation (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrovgl-core"
readme = "README.md"
keywords = ["gui", "embedded", "no-std", "lvgl", "ui"]
categories = ["gui", "embedded", "no-std", "graphics", "rendering"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
    "/TRADEMARK.md",
    "/src/**",
]

[features]
default = ["float", "flex", "grid", "observer", "snapshot", "bidi", "arabic-persian-chars", "obj-id"]
std = ["log?/std"]
float = []
libm = ["dep:libm"]
log = ["dep:log"]
assert-style = []
assert-obj = []
check-arg-panic = []
# `LV_USE_OBJ_ID` + `LV_USE_OBJ_ID_BUILTIN` + `LV_OBJ_ID_AUTO_ASSIGN` (on in the parity config).
obj-id = []
obj-name = []
flex = []
grid = []
observer = []
snapshot = []
bidi = []
arabic-persian-chars = []
gridnav = []
gesture-recognition = []
binfont = []

[dependencies]
bitflags = { workspace = true }
libm = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
