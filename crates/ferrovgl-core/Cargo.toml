[package]
name = "ferrovgl-core"
description = "Core of ferrovgl, a pure-Rust reimplementation of LVGL v9.6.0: object tree, styles, events, layouts, draw model, fonts, input, timers, animation (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["float", "flex", "grid", "observer", "snapshot", "bidi", "arabic-persian-chars"]
std = ["log?/std"]
float = []
libm = ["dep:libm"]
log = ["dep:log"]
assert-style = []
assert-obj = []
check-arg-panic = []
obj-id = []
obj-name = []
flex = []
grid = []
observer = []
snapshot = []
bidi = []
arabic-persian-chars = []
gridnav = []
gesture-recognition = []
binfont = []

[dependencies]
bitflags = { workspace = true }
libm = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
