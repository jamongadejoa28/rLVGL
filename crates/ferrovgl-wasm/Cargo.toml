[package]
name = "ferrovgl-wasm"
description = "Canvas2D backend for running ferrovgl in the browser (wasm32)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrovgl-wasm"
readme = "README.md"
keywords = ["gui", "wasm", "canvas", "browser", "lvgl"]
categories = ["gui", "wasm", "web-programming"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
    "/TRADEMARK.md",
    "/src/**",
    "/scripts/node-smoke.mjs",
    "/www/index.html",
    "/www/main.js",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Render with the same draw-sw, core and widget feature set the upstream
# reference images use (the workspace dependencies have default features off).
default = ["full-render"]
full-render = ["ferrovgl-core/default", "ferrovgl-draw-sw/default", "ferrovgl-widgets/default", "ferrovgl-examples/complex-gradients"]

[dependencies]
ferrovgl-core = { workspace = true, features = ["std"] }
ferrovgl-draw-sw = { workspace = true, features = ["std"] }
ferrovgl-widgets = { workspace = true, features = ["std", "label", "button", "image", "bar", "slider", "switch", "checkbox", "arc", "line", "led", "spinner", "buttonmatrix", "textarea", "observer", "theme-default", "theme-simple"] }
ferrovgl-fonts = { workspace = true, features = ["montserrat-14", "default-montserrat-14"] }
ferrovgl-examples = { workspace = true, features = ["std"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlSelectElement", "HtmlOptionElement",
    "CanvasRenderingContext2d", "ImageData", "Performance", "DomRect", "CssStyleDeclaration",
    "Event", "EventTarget", "MouseEvent", "PointerEvent", "KeyboardEvent", "WheelEvent", "FocusEvent", "AddEventListenerOptions",
    "console",
] }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-pack downloads (and caches) binaryen for this step; pass
# `--no-opt` to skip it when offline.
wasm-opt = ["-Os"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
