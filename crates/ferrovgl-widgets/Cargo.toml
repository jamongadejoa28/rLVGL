[package]
name = "ferrovgl-widgets"
description = "Widgets and themes for ferrovgl, a pure-Rust reimplementation of LVGL v9.6.0 (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["label", "button", "image", "bar", "slider", "switch", "checkbox", "arc", "line", "led", "spinner", "buttonmatrix", "textarea", "observer", "float", "bidi", "arabic-persian-chars", "theme-default", "theme-simple"]
std = ["ferrovgl-core/std"]
label = []
button = []
image = []
bar = []
slider = ["bar"]
switch = []
checkbox = []
arc = []
line = []
led = []
spinner = ["arc"]
buttonmatrix = []
textarea = ["label"]
# `LV_USE_OBSERVER`: subject bindings of the widgets (`observer.rs`).
observer = ["ferrovgl-core/observer"]
# `LV_USE_FLOAT`: forwards to `ferrovgl-core/float` (float subjects, `lv_value_precise_t` = `f32`).
float = ["ferrovgl-core/float"]
# `LV_USE_BIDI` / `LV_USE_ARABIC_PERSIAN_CHARS` branches of the widgets.
bidi = ["ferrovgl-core/bidi"]
arabic-persian-chars = ["ferrovgl-core/arabic-persian-chars"]
theme-default = []
theme-simple = []
theme-mono = []

[dependencies]
ferrovgl-core = { workspace = true }
ferrovgl-fonts = { workspace = true }

[dev-dependencies]
ferrovgl-fonts = { workspace = true, features = ["montserrat-14"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
