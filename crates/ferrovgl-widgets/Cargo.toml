[package]
name = "ferrovgl-widgets"
description = "Widgets and themes for ferrovgl, a pure-Rust reimplementation of LVGL v9.6.0 (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["label", "button", "image", "bar", "slider", "switch", "checkbox", "arc", "line", "led", "spinner", "buttonmatrix", "textarea", "theme-default", "theme-simple"]
std = ["ferrovgl-core/std"]
label = []
button = []
image = []
bar = []
slider = ["bar"]
switch = []
checkbox = []
arc = []
line = []
led = []
spinner = ["arc"]
buttonmatrix = []
textarea = ["label"]
theme-default = []
theme-simple = []
theme-mono = []

[dependencies]
ferrovgl-core = { workspace = true }
ferrovgl-fonts = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
